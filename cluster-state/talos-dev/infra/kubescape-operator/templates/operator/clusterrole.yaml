---
# Source: kubescape-operator/templates/operator/clusterrole.yaml
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: operator
  annotations:
    
  labels:
    helm.sh/chart: kubescape-operator-1.30.0
    app.kubernetes.io/name: kubescape-operator
    app.kubernetes.io/instance: kubescape
    app.kubernetes.io/component: operator
    app.kubernetes.io/version: "1.30.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubescape
    app: operator
    tier: ks-control-plane
    kubescape.io/ignore: "true"
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "configmaps", "services"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "watch", "list", "create", "update", "delete" ,"patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["spdx.softwarecomposition.kubescape.io"]
    resources: ["vulnerabilitymanifests", "vulnerabilitymanifestsummaries", "workloadconfigurationscans", "workloadconfigurationscansummaries", "openvulnerabilityexchangecontainers", "containerprofiles", "sbomsyfts"]
    verbs: ["get", "watch", "list", "delete"]
  - apiGroups: ["kubescape.io"]
    resources: ["runtimerulealertbindings"]
    verbs: ["list", "watch", "get"]
  - apiGroups: ["kubescape.io"]
    resources: ["servicesscanresults"]
    verbs: ["get", "watch", "list", "create", "update", "delete" ,"patch"]
  - apiGroups: ["kubescape.io"]
    resources: ["operatorcommands"]
    verbs: ["get", "watch", "list", "create", "update", "patch"]
  - apiGroups: ["kubescape.io"]
    resources: ["operatorcommands/status"]
    verbs: ["get", "watch", "list", "update", "patch"]
