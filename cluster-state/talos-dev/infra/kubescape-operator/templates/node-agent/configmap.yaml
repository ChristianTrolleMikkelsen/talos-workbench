        "excludeJsonPaths":null,
        "ruleCooldown": {
            "ruleCooldownDuration": "1h",
            "ruleCooldownAfterCount": 1,
            "ruleCooldownOnProfileFailure": true,
            "ruleCooldownMaxSize": 20000
        },
        "alertDeduplication": {
            "bypass": false
        },
        "dCapSys": false,
        "dDns": false,
        "dExec": false,
