# Source: spegel/templates/servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: spegel
  namespace: spegel-system
  labels:
    helm.sh/chart: spegel-0.6.0
    app.kubernetes.io/name: spegel
    app.kubernetes.io/instance: spegel
    app.kubernetes.io/version: "v0.6.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: metrics
      app.kubernetes.io/name: spegel
      app.kubernetes.io/instance: spegel
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 30s
