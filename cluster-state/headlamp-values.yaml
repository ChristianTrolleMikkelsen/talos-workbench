# Plugin Manager Sidecar Container Configuration
pluginsManager:
  # -- Enable plugin manager
  enabled: true

nodeSelector:
  node-role.kubernetes.io/state: ""

config:
  oidc:
    secret:
      create: false
  pluginsDir: /build/plugins

initContainers:
  - command:
      - /bin/sh
      - '-c'
      - mkdir -p /build/plugins && cp -r /plugins/* /build/plugins/
    image: quay.io/kubescape/headlamp-plugin:v0.10.3
    name: kubescape-plugin
    volumeMounts:
      - mountPath: /build/plugins
        name: plugins-dir
